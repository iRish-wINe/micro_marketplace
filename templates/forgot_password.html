<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recover BizHub Account</title><style>body{font-family:system-ui;background:#f4f7fb;margin:0;padding:24px}.card{max-width:440px;margin:8vh auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 10px 35px #0001}input{width:100%;padding:12px;margin:8px 0 14px;box-sizing:border-box;border:1px solid #d7dee8;border-radius:10px}button{width:100%;padding:12px;border:0;border-radius:10px;background:#f59e0b;color:#172554;font-weight:900}.err{color:#b91c1c;background:#fee2e2;padding:10px;border-radius:10px}.ok{background:#dcfce7;padding:10px;border-radius:10px;word-break:break-word}</style></head><body><div class="card"><h1>Recover Account</h1><p>Enter the WhatsApp number registered to your BizHub account.</p>{% if reset_error %}<div class="err">{{ reset_error }}</div>{% endif %}{% if reset_link %}<div class="ok">Recovery link prepared. Continue through WhatsApp.</div><p><a href="{{ reset_link }}">Open WhatsApp</a></p>{% endif %}<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input name="whatsapp_number" placeholder="WhatsApp number" required><button>Recover Account</button></form><p><a href="{{ url_for('login') }}">Back to login</a></p></div></body></html>
