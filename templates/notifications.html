<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizHub Notifications</title><style>body{font-family:system-ui;background:#f4f7fb;margin:0;padding:18px}.wrap{max-width:850px;margin:auto}.item{background:#fff;padding:16px;border-radius:15px;margin:10px 0;box-shadow:0 3px 15px #0000000b}.unread{border-left:5px solid #f59e0b}</style></head><body><div class="wrap"><h1>🔔 Notifications</h1><p><a href="{{ url_for('home') }}">Home</a></p>{% for n in notifications %}<div class="item {% if not n['is_read'] %}unread{% endif %}"><strong>{{ n['title'] }}</strong><p>{{ n['message'] }}</p>{% if n['link'] %}<a href="{{ n['link'] }}">Open</a>{% endif %}{% if not n['is_read'] %}<form method="post" action="{{ url_for('mark_customer_notification_read', notification_id=n['id']) if user['role']=='Customer' else url_for('mark_notification_read', notification_id=n['id']) }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button>Mark read</button></form>{% endif %}</div>{% else %}<div class="item">No notifications yet.</div>{% endfor %}</div></body></html>
<script>if("serviceWorker" in navigator && "PushManager" in window){fetch("/push/vapid-public-key").then(r=>r.json()).then(async k=>{if(!k.public_key)return;const reg=await navigator.serviceWorker.register("/service-worker.js");let s=await reg.pushManager.getSubscription();if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:Uint8Array.from(atob(k.public_key.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0))});await fetch("/push/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(s)});}).catch(()=>{});}</script>
