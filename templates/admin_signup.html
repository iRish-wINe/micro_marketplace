<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Bootstrap | BizHub</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;display:grid;place-items:center;min-height:100vh}.card{width:min(420px,calc(100% - 32px));background:#fff;padding:28px;border-radius:16px;box-shadow:0 8px 30px #0001}h1{margin-top:0}.err{background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px;margin-bottom:14px}label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:8px}button{width:100%;margin-top:16px;padding:11px;border:0;border-radius:8px;background:#1d4ed8;color:white;font-weight:800}a{display:inline-block;margin-top:14px;color:#1d4ed8}</style></head><body><main class="card"><h1>Bootstrap Admin</h1><p>Only use this page for the first administrator. It is disabled by default.</p>{% if admin_error %}<div class="err">{{ admin_error }}</div>{% endif %}<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Admin username</label><input name="username" required autocomplete="username"><label>Password</label><input type="password" name="password" required minlength="12" autocomplete="new-password"><label>Confirm password</label><input type="password" name="confirm_password" required minlength="12" autocomplete="new-password"><button>Create admin account</button></form><a href="{{ url_for('admin_login') }}">Back to admin sign in</a></main></body></html>
