<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizHub Admin Setup</title><style>body{font-family:system-ui;background:#0B192C;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:#fff;padding:28px;border-radius:14px;width:min(420px,90vw)}input{width:100%;box-sizing:border-box;padding:11px;margin:7px 0 12px;border:1px solid #d1d5db;border-radius:8px}button{width:100%;padding:11px;background:#F59E0B;border:0;border-radius:8px;font-weight:900}.err{color:#b91c1c;font-weight:800}</style></head><body><div class="card"><h1>🛡️ Create BizHub Admin</h1>{% if admin_error %}<p class="err">{{ admin_error }}</p>{% endif %}<form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input name="username" placeholder="Admin username" required><input type="password" name="password" placeholder="Password" required><input type="password" name="confirm_password" placeholder="Confirm password" required><button>Create Admin</button></form></div></body></html>
