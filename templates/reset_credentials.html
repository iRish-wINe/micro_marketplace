<!DOCTYPE html>
<html>
<head>
    <title>Reset Biz Hub Credentials</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='biz-hub-logo.svg') }}">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 18px; background: #f7fafc; color: #2d3748; font-family: 'Segoe UI', sans-serif; }
        .panel { width: min(100%, 460px); padding: 28px; background: white; border: 1px solid #e2e8f0; border-radius: 10px; box-shadow: 0 10px 24px rgba(0,0,0,0.08); }
        .logo { display: block; width: min(100%, 300px); margin: 0 auto 20px; }
        h1 { margin: 0 0 10px; font-size: 24px; }
        label { display: block; margin: 18px 0 7px; font-weight: bold; }
        input { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 5px; font-size: 16px; }
        button { width: 100%; padding: 12px; margin-top: 20px; border: 0; border-radius: 5px; color: white; background: #319795; font-weight: bold; cursor: pointer; }
        .error { padding: 10px; color: #822727; background: #fed7d7; border-radius: 5px; font-weight: bold; }
        .back { display: block; margin-top: 16px; color: #2b6cb0; text-align: center; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
    <main class="panel">
        <img class="logo" src="{{ url_for('static', filename='biz-hub-logo.svg') }}" alt="Biz Hub">
        <h1>Reset your credentials</h1>
        {% if reset_error %}<div class="error">{{ reset_error }}</div>{% endif %}
        {% if token %}
            <p>Choose a new username and password for your Biz Hub account.</p>
            <form method="POST">
                <label for="username">New username</label>
                <input id="username" name="username" type="text" value="{{ user.username if user else '' }}" required>
                <label for="password">New password</label>
                <input id="password" name="password" type="password" required>
                <label for="confirm_password">Confirm new password</label>
                <input id="confirm_password" name="confirm_password" type="password" required>
                <button type="submit">Save new credentials</button>
            </form>
        {% endif %}
        <a class="back" href="{{ url_for('login') }}">Back to sign in</a>
    </main>
</body>
</html>
