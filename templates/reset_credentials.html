<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset BizHub Credentials</title><style>body{font-family:system-ui;background:#f4f7fb;margin:0;padding:24px}.card{max-width:440px;margin:8vh auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 10px 35px #0001}input{width:100%;padding:12px;margin:8px 0 14px;box-sizing:border-box;border:1px solid #d7dee8;border-radius:10px}button{width:100%;padding:12px;border:0;border-radius:10px;background:#172554;color:#fff;font-weight:900}.err{color:#b91c1c;background:#fee2e2;padding:10px;border-radius:10px}</style></head><body><div class="card"><h1>Reset Credentials</h1>{% if reset_error %}<div class="err">{{ reset_error }}</div>{% endif %}{% if token %}<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input name="username" value="{{ user['username'] if user else '' }}" placeholder="Username" required><input name="password" type="password" placeholder="New password" required><input name="confirm_password" type="password" placeholder="Confirm new password" required><button>Save New Credentials</button></form>{% endif %}</div></body></html>
