<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report {{ target.company_name or target.username }} | BizHub</title><style>body{font-family:system-ui,sans-serif;background:#f4f7fb;color:#172033;margin:0;padding:24px}.wrap{max-width:620px;margin:auto}.card{background:#fff;border:1px solid #dbe3ed;border-radius:12px;padding:24px;box-shadow:0 4px 18px #0000000c}label{display:block;font-size:12px;font-weight:800;color:#475569;margin:16px 0 6px}select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:7px;font:inherit}textarea{min-height:150px;resize:vertical}.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}button,a{padding:10px 14px;border-radius:7px;border:1px solid #dbe3ed;background:#fff;color:#1d4ed8;text-decoration:none;font-weight:800;cursor:pointer}button{background:#dc2626;color:#fff;border-color:#dc2626}.error{padding:10px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:7px;font-size:13px}</style></head>
<body><main class="wrap"><div class="card"><h1>Report {{ target.company_name or target.username }}</h1><p>Tell BizHub what happened. Reports are reviewed by an admin before action is taken.</p>{% if report_error %}<div class="error">{{ report_error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="category">Report category</label><select id="category" name="category"><option>Fraud or payment</option><option>Unsafe or abusive conduct</option><option>Misleading listing</option><option>Spam</option><option>Other</option></select><label for="description">What happened?</label><textarea id="description" name="description" required placeholder="Include relevant order, listing, payment, or message details."></textarea><div class="actions"><button type="submit">Submit report</button><a href="{{ url_for('home') }}">Cancel</a></div></form></div></main></body></html>
