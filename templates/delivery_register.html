<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Register Delivery Service | Biz Hub</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-100 font-sans text-slate-900"><main class="max-w-2xl mx-auto px-4 py-10"><a href="/" class="font-black text-slate-900 no-underline">← Biz<span class="text-emerald-600">Hub</span></a><section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mt-6"><h1 class="text-3xl font-black">🚚 Register a Delivery Service</h1><p class="text-slate-500 mt-2">Create a delivery profile vendors can find. You control when you are available.</p>{% if error %}<div class="mt-5 p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm font-bold">{{ error }}</div>{% endif %}<form method="POST" enctype="multipart/form-data" class="space-y-4 mt-6"><input name="service_name" required class="w-full border rounded-xl px-4 py-3" placeholder="Company / brand / individual delivery name"><input name="username" required class="w-full border rounded-xl px-4 py-3" placeholder="Username"><input name="email" type="email" required class="w-full border rounded-xl px-4 py-3" placeholder="Email"><input name="password" type="password" required class="w-full border rounded-xl px-4 py-3" placeholder="Password"><input name="operating_location" required class="w-full border rounded-xl px-4 py-3" placeholder="Operating city / location"><input name="phone_number" required class="w-full border rounded-xl px-4 py-3" placeholder="Phone number — required"><input name="service_area" required class="w-full border rounded-xl px-4 py-3" placeholder="Service area, e.g. Accra, Tema and nearby areas"><select name="delivery_type" class="w-full border rounded-xl px-4 py-3">{% for kind in delivery_types %}<option>{{ kind }}</option>{% endfor %}</select><input name="logo" type="file" accept="image/*" class="w-full border rounded-xl px-4 py-3"><button class="w-full bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl py-3 font-black">Register Delivery Service</button></form><p class="text-xs text-slate-400 mt-4">After registration, set your status to Available whenever you are working.</p></section></main></body></html>
