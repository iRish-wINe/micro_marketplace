<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Register Delivery Service | BizHub</title>
<style>:root{--navy:#0B192C;--orange:#F59E0B;--bg:#EAEDED;--text:#0F172A;--muted:#565959;--border:#D5D9D9}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;color:var(--text);padding:25px 14px}.wrap{max-width:680px;margin:auto}.brand{display:block;text-align:center;color:#fff;background:var(--navy);padding:16px;border-radius:9px 9px 0 0;text-decoration:none;font-size:25px;font-weight:900}.brand span{color:var(--orange)}.card{background:#fff;border:1px solid var(--border);border-top:0;border-radius:0 0 9px 9px;padding:24px;box-shadow:0 4px 15px rgba(0,0,0,.08)}h1{margin:0 0 7px;font-size:21px}.intro{color:var(--muted);font-size:12px;line-height:1.5;margin-bottom:20px}.error{background:#FFF5F5;border:1px solid #FECACA;color:#B91C1C;padding:10px;border-radius:7px;font-size:12px;font-weight:700;margin-bottom:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.group{margin-bottom:14px}.group.full{grid-column:1/-1}label{display:block;font-size:11px;font-weight:800;margin-bottom:5px}.required{color:#B91C1C}.input{width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff}.input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(245,158,11,.12)}.help{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4}.password{position:relative}.password .input{padding-right:40px}.toggle{position:absolute;right:7px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;font-size:16px}.submit{width:100%;border:1px solid #E5A000;background:var(--orange);color:#111;padding:11px;border-radius:6px;font-size:13px;font-weight:900;cursor:pointer}.back{display:block;text-align:center;margin-top:13px;color:var(--navy);font-size:11px;font-weight:800;text-decoration:none}@media(max-width:620px){.grid{grid-template-columns:1fr}.group.full{grid-column:auto}.card{padding:18px}.brand{font-size:21px}}</style></head>
<body><div class="wrap"><a href="/" class="brand">Biz<span>Hub</span></a><div class="card"><h1>🚚 Register as a Delivery Service</h1><p class="intro">Register your delivery company, brand, or individual delivery service so BizHub merchants can find you when delivery is needed.</p>{% if error %}<div class="error">❌ {{ error }}</div>{% endif %}
<form method="POST" action="/delivery/register" enctype="multipart/form-data" id="deliveryForm">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="grid">
<div class="group"><label>Company / Delivery Name <span class="required">*</span></label><input class="input" name="service_name" required value="{{ request.form.get('service_name','') }}" placeholder="e.g. SwiftGo Delivery"></div>
<div class="group"><label>Username <span class="required">*</span></label><input class="input" name="username" required value="{{ request.form.get('username','') }}" placeholder="e.g. swiftgo_delivery" autocomplete="username"></div>
<div class="group"><label>Email <span class="required">*</span></label><input class="input" type="email" name="email" required value="{{ request.form.get('email','') }}" placeholder="name@example.com" autocomplete="email"></div>
<div class="group"><label>Phone / WhatsApp <span class="required">*</span></label><input class="input" type="tel" name="phone_number" required value="{{ request.form.get('phone_number','') }}" placeholder="e.g. 0558272972"></div>
<div class="group"><label>Operating Location <span class="required">*</span></label><input class="input" name="operating_location" required value="{{ request.form.get('operating_location','') }}" placeholder="e.g. Accra, Ghana"></div>
<div class="group"><label>Service Area <span class="required">*</span></label><input class="input" name="service_area" required value="{{ request.form.get('service_area','') }}" placeholder="e.g. Accra & Tema"></div>
<div class="group"><label>Delivery Type</label><select class="input" name="delivery_type">{% for dtype in delivery_types %}<option value="{{ dtype }}" {% if request.form.get('delivery_type','Motorcycle') == dtype %}selected{% endif %}>{{ dtype }}</option>{% endfor %}</select></div>
<div class="group"><label>Logo (Optional)</label><input class="input" type="file" name="logo" accept="image/png,image/jpeg,image/jpg,image/webp,image/gif"><div class="help">Optional company/brand logo.</div></div>
<div class="group"><label>Password <span class="required">*</span></label><div class="password"><input id="deliveryPassword" class="input" type="password" name="password" required minlength="6" autocomplete="new-password"><button type="button" class="toggle" onclick="togglePassword('deliveryPassword',this)">👁</button></div></div>
<div class="group"><label>Confirm Password <span class="required">*</span></label><div class="password"><input id="deliveryConfirm" class="input" type="password" name="confirm_password" required minlength="6" autocomplete="new-password"><button type="button" class="toggle" onclick="togglePassword('deliveryConfirm',this)">👁</button></div></div>
<div class="group full"><button class="submit" type="submit">🚚 Create Delivery Service Account</button></div></div></form><a class="back" href="/login">← Back to BizHub Login / Register</a></div></div>
<script>function togglePassword(id,b){const i=document.getElementById(id);const show=i.type==='password';i.type=show?'text':'password';b.textContent=show?'🙈':'👁'}document.getElementById('deliveryForm').addEventListener('submit',function(e){const a=document.getElementById('deliveryPassword'),b=document.getElementById('deliveryConfirm');if(a.value!==b.value){e.preventDefault();b.setCustomValidity('Passwords do not match.');b.reportValidity()}else b.setCustomValidity('')});</script></body></html>
